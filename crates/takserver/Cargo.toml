[package]
name = "takserver"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
roxmltree.workspace = true
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive"] }
cot = { version = "0.1.0", path = "../cot" }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"
