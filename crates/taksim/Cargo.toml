[package]
name = "taksim"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
cot = { version = "0.1.0", path = "../cot" }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
